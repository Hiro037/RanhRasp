services:
  db:
    image: postgres:15-alpine
    container_name: ranhrasp_db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-ranhrasp}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secretpassword}
      POSTGRES_DB: ${DB_NAME:-ranhrasp_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-ranhrasp} -d ${DB_NAME:-ranhrasp_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  tg_bot:
    build: .
    container_name: ranhrasp_tg_bot
    restart: always
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${DB_USER:-ranhrasp}:${DB_PASSWORD:-secretpassword}@db:5432/${DB_NAME:-ranhrasp_db}
    volumes:
      - ./logs:/app/logs
    command: ["python", "main_tg.py"]    # явно указываем скрипт

  vk_bot:
    build: .
    container_name: ranhrasp_vk_bot
    restart: always
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${DB_USER:-ranhrasp}:${DB_PASSWORD:-secretpassword}@db:5432/${DB_NAME:-ranhrasp_db}
    volumes:
      - ./logs:/app/logs
    command: [ "python", "main_vk.py" ]    # VK-бот

volumes:
  postgres_data: