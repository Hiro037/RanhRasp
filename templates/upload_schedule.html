<body>
    <h1>Загрузка расписания из файла</h1>
    
    <form action="/upload-schedule" method="post" enctype="multipart/form-data">
        <div class="form-group">
            <label for="group_id">Выберите группу:</label>
            <select id="group_id" name="group_id" required>
                <option value="">-- Выберите группу --</option>
                {% for group in groups %}
                    <option value="{{ group.group_id }}">{{ group.group_name }}</option>
                {% endfor %}
            </select>
        </div>
        
        <div class="form-group">
            <label for="file">Выберите файл расписания (.docx):</label>
            <input type="file" id="file" name="file" accept=".docx" required>
        </div>
        
        <button type="submit">📤 Загрузить расписание</button>
    </form>
    
    <a href="/" class="back-link">← Назад к главной странице</a>
</body>
