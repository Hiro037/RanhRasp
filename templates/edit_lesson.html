<!DOCTYPE html>
<html>
<head>
    <title>Редактирование занятия</title>
</head>
<body>
    <h1>Редактирование занятия</h1>
    <form method="post" action="/update-lesson/{{ lesson.lesson_id }}">
        <label>Начало:</label>
        <input type="datetime-local" name="start_datetime"
               value="{{ lesson.start_datetime.strftime('%Y-%m-%dT%H:%M') }}" required>
        <br>

        <label>Группа:</label>
        <select name="group_id" required>
            {% for group in groups %}
                <option value="{{ group.group_id }}"
                    {% if group.group_id == lesson.group_id %}selected{% endif %}>
                    {{ group.group_name }}
                </option>
            {% endfor %}
        </select>
        <br>

        <label>Преподаватель:</label>
        <select name="teacher_id" required>
            {% for teacher in teachers %}
                <option value="{{ teacher.teacher_id }}"
                    {% if teacher.teacher_id == lesson.teacher_id %}selected{% endif %}>
                    {{ teacher.name }}
                </option>
            {% endfor %}
        </select>
        <br>

        <label>Аудитория:</label>
        <input type="text" name="classroom" value="{{ lesson.classroom }}" required>
        <br>

        <label>Предмет:</label>
        <select name="subject_id" required>
            {% for subject in subjects %}
                <option value="{{ subject.subject_id }}"
                    {% if subject.subject_id == lesson.subject_id %}selected{% endif %}>
                    {{ subject.name }}
                </option>
            {% endfor %}
        </select>
        <br>

        <label>Тип занятия:</label>
        <input type="text" name="lesson_type" value="{{ lesson.lesson_type or '' }}">
        <br>

        <button type="submit">Сохранить</button>
        <a href="/">Отмена</a>
    </form>
</body>
</html>
