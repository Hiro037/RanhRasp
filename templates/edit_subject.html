<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Редактирование предмета</title>
</head>
<body>
    <h1>Редактирование предмета</h1>
    <form method="post" action="/update-subject/{{ subject.subject_id }}">
        <label for="name">Название предмета:</label>
        <input type="text" id="name" name="name" value="{{ subject.name }}" required>
        <button type="submit">Сохранить</button>
    </form>
    <br>
    <a href="/subject/{{ subject.subject_id }}">Отмена</a>
</body>
</html>
