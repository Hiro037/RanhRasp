<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Generated Page</title>
  <meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@100;200;300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="global.css">
  <style id="sections-styles">
/* CSS for section section:Schedule */
.schedule-container {
    max-width: 624px;
    margin: 0 auto;
    padding: 39px 28px 64px;
    background-color: #000000;
    position: relative;
    overflow: hidden;
  }

.picture {
  position: absolute;
  right: -400px;
  bottom: -400px;
  width: 750px;
  height: 750px;
  background-image: url(images/6_235.svg);
  background-size: contain;
  background-repeat: no-repeat;
  z-index: 1;
  pointer-events: none;
}

  .content-wrapper {
    position: relative;
    z-index: 2;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
  }

  .schedule-title {
    color: #921a1d;
    font-family: 'Montserrat', sans-serif;
    font-weight: 300;
    font-size: 36px;
    line-height: 1.2;
    margin: 0;
  }

  .schedule-date {
    color: #ffffff;
    font-family: 'Montserrat', sans-serif;
    font-weight: 700;
    font-size: 88px;
    line-height: 1.2;
    margin: -16px 0 0 0; /* Based on 822 - (777 + 43.88) */
  }

  .schedule-subject {
    color: #ffffff;
    font-family: 'Montserrat', sans-serif;
    font-weight: 100;
    font-size: 50px;
    line-height: 1.2;
    text-shadow: 0px 4px 4px #921a1d;
    margin: -24px 0 0 0; /* Based on 911 - (822 + 117.02) */
  }

  .message-box {
    border: 1px solid #921a1d;
    width: 434px;
    height: 328px;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
    margin-top: 43px; /* Based on 1034 - (911 + 80) */
    margin-left: 67px; /* Based on 1458 - 1391 */
  }

.message-text {
  color: #ffffff;
  text-shadow:
    -1px 0 #921a1d,
     1px 0 #921a1d,
     0 -1px #921a1d,
     0  1px #921a1d;
  font-family: 'Montserrat', sans-serif;
  font-weight: 300;
  font-size: 64px;
  line-height: 1.2;
  text-align: center;
  margin: 0;
}
  </style>
  <script src="global.js" defer></script>
</head>
<body>
<section id="schedule" class="schedule-container">
  <div class="picture"></div>
  <div class="content-wrapper">
    <p class="schedule-title">РАСПИСАНИЕ</p>
    <h1 class="schedule-date">{{date | upper}}</h1>
    <p class="schedule-subject">{{topic | upper}}</p>
    <div class="message-box">
      <p class="message-text">у Вас нет занятий в этот день</p>
    </div>
  </div>
</section>
</body>
</html>
