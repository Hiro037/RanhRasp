<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Занятие</title>
</head>
<body>
    <h1>Занятие</h1>
    <p>Предмет: {{ lesson.subject.name }}</p>
    <p>Группа: {{ lesson.group.group_name }}</p>
    <p>Преподаватель: {{ lesson.teacher.name }}</p>
    <p>Аудитория: {{ lesson.classroom }}</p>
    <p>Начало: {{ lesson.start_datetime }}</p>
    <p>Окончание: {{ lesson.end_datetime }}</p>

    <a href="/edit-lesson/{{ lesson.lesson_id }}">Редактировать</a>
    <form method="post" action="/delete-lesson/{{ lesson.lesson_id }}" style="display: inline;">
        <button type="submit">Удалить</button>
    </form>
    <br><br>
    <a href="/">На главную</a>
</body>
</html>
